<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>JavaScript Operators</h1>
    <h2>The type</h2>
   
    <p id="demo"></p>

    <script>
        document.getElementById("demo").innerHTML =
            "'Teja' is " + typeof "Teja" + "<br>"
            +
            "('Te' + 'Ja') is " + typeof ("Te" + "Ja") + "<br>"
            +
            "3.14 is " + typeof 3.14 + "<br>"
            +
            "33 is " + typeof 33 + "<br>"
            +
            "(33 + 66) is " + typeof (33 + 66) + "<br>"
            +
            "NaN is " + typeof NaN + "<br>"
            +
            "true is " + typeof true + "<br>"
            +
            "false is " + typeof false + "<br>"
            +
            "1234n is " + typeof 1234n + "<br>"
            +
            "Symbol() is " + typeof Symbol() + "<br>"
            +
            "x is " + typeof x;



        
    </script>

</body>

</html>
