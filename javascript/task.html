<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i = 1; i <= 10; i++) {
    console.log(i);
}

for(let i = 1; i <= 10; i++) {
    console.log("5 x " + i + " = " + (5 * i));
}


let i = 1;

while(i <= 5) {
    console.log(i);
    i++;
}

let num = 2;

while(num <= 10) {
    console.log(num);
    num += 2;
}

let i = 1;

do {
    console.log(i);
    i++;
} while(i <= 5);


let num = 5;

do {
    console.log(num);
    num--;
} while(num >= 1);




let fruits = ["Apple", "Banana", "Mango"];

for(let fruit of fruits) {
    console.log(fruit);
}


let name = "Teja";

for(let ch of name) {
    console.log(ch);
}



let student = {
    name: "Teja",
    age: 23,
    course: "JavaScript"
};

for(let key in student) {
    console.log(key + ": " + student[key]);
}

let colors = ["Red", "Blue", "Green"];

for(let index in colors) {
    console.log(index);
}
    </script>
