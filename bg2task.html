<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Changer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: white;
            transition: 0.5s;
        }

        .container {
            text-align: center;
            margin-top: 200px;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Click to change Background </h1>

        <button onclick="changeRed()">Red</button>
        <button onclick="changeBlue()">Blue</button>
        <button onclick="changeGreen()">Green</button>
        <button onclick="changeYellow()">Yellow</button>
        <button onclick="changeWhite()">White</button>
    </div>

    <script>
        function changeRed() {
            document.body.style.backgroundColor = "red";
        }

        function changeBlue() {
            document.body.style.backgroundColor = "blue";
        }

        function changeGreen() {
            document.body.style.backgroundColor = "green";
        }

        function changeYellow() {
            document.body.style.backgroundColor = "yellow";
        }

        function changeWhite() {
            document.body.style.backgroundColor = "white";
        }
    </script>

</body>

</html>
